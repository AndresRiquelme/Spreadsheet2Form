<!DOCTYPE html>
<html lang="en>

<head>
    <meta charset="UTF-8">
    <title>Spreadsheet2Form</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body id="popupBody">
<!-- Main popup interface -->

<div id="mainContent">
  <button id="fill">
    Compare Spreadsheet with Form
  </button>
</div>

<!-- Validation / information messages -->

<div id="messageBox"
     class="message hidden">

    <div id="messageIcon"
         class="messageIcon">

    </div>

    <div id="messageTitle"
         class="messageTitle">

    </div>

    <div id="messageText"
         class="messageText">

    </div>

    <button id="messageClose">

        Close Spreadsheet2Form

    </button>

</div>
<script src="clipboard.js"></script>
<script src="validation.js"></script>
<script src="compare.js"></script>
<script src="message.js"></script>
<script src="popup.js"></script>

</body>

</html>
